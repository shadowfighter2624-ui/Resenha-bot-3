name: Enviar para Quaxly

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar dependências no GitHub
        run: |
          npm install

      - name: Preparar Quaxly
        env:
          QUAXLY_HOST: ${{ secrets.QUAXLY_HOST }}
          QUAXLY_PORT: ${{ secrets.QUAXLY_PORT }}
          QUAXLY_USER: ${{ secrets.QUAXLY_USER }}
          QUAXLY_PASSWORD: ${{ secrets.QUAXLY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          printf "require('./src/index.js');\n" > index.js
          sshpass -p "$QUAXLY_PASSWORD" sftp -4 -o StrictHostKeyChecking=no -P "$QUAXLY_PORT" "$QUAXLY_USER@$QUAXLY_HOST" <<'EOF'
          -mkdir node_modules
          -rename package.json package.json.disabled
          bye
          EOF

      - name: Enviar node_modules
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.QUAXLY_USER }}
          server: ${{ secrets.QUAXLY_HOST }}
          port: ${{ secrets.QUAXLY_PORT }}
          password: ${{ secrets.QUAXLY_PASSWORD }}
          local_path: './node_modules/*'
          remote_path: '/node_modules'
          sftp_only: true

      - name: Enviar src
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.QUAXLY_USER }}
          server: ${{ secrets.QUAXLY_HOST }}
          port: ${{ secrets.QUAXLY_PORT }}
          password: ${{ secrets.QUAXLY_PASSWORD }}
          local_path: './src/*'
          remote_path: '/src'
          sftp_only: true

      - name: Enviar index.js
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.QUAXLY_USER }}
          server: ${{ secrets.QUAXLY_HOST }}
          port: ${{ secrets.QUAXLY_PORT }}
          password: ${{ secrets.QUAXLY_PASSWORD }}
          local_path: './index.js'
          remote_path: '/'
          sftp_only: true
