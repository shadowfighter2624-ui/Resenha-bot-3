name: Testar Quaxly

on:
  workflow_dispatch:

jobs:
  testar-sftp:
    runs-on: ubuntu-latest

    steps:
      - name: Testar conexão SFTP
        env:
          QUAXLY_HOST: ${{ secrets.QUAXLY_HOST }}
          QUAXLY_PORT: ${{ secrets.QUAXLY_PORT }}
          QUAXLY_USER: ${{ secrets.QUAXLY_USER }}
          QUAXLY_PASSWORD: ${{ secrets.QUAXLY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$QUAXLY_PASSWORD" sftp -o StrictHostKeyChecking=no -P "$QUAXLY_PORT" "$QUAXLY_USER@$QUAXLY_HOST" <<'EOF'
          pwd
          ls -la
          bye
          EOF
